[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wlp_chemspace"
dynamic = ["version"]
description = "Workflows used in the paper \"Chemical Space of Linker-Payloads for Antibody-Drug Conjugates\""
authors = [{ name = "Joan Clark-Nicolas", email = "joan.clark-nicolas@strath.ac.uk" }]
dependencies = [
    "pytest",
    "redim",
]
[tool.setuptools.dynamic]
version = {attr = "wlp_chemspace.__version__"}

